name: Vlocity
description: >-
  Vlocity was an industry-cloud software company founded in 2014 (by David
  Schmaier and team) that built vertical CRM applications on the Salesforce
  Platform for communications, media, energy, insurance, health, and the public
  sector, along with the OmniStudio low-code toolset (OmniScript, FlexCards,
  DataRaptor, Integration Procedures). Backed by Bessemer Venture Partners,
  Accel, Sutter Hill Ventures, and Salesforce Ventures, Vlocity was acquired by
  Salesforce in 2020 and folded into Salesforce Industries; the platform now
  ships as Salesforce OmniStudio. Vlocity no longer exists as an independent
  company and publishes no independent developer portal or public API — its
  domain (vlocity.com) is defunct (HTTP 503) and is now operated by Salesforce
  (confirmed via SPF/DMARC delegation to salesforce.com and a Salesforce, Inc.
  TLS certificate). Any API surface lives under Salesforce OmniStudio.
